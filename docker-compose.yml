# Infraestrutura local de desenvolvimento.
# Subir:    docker compose up -d
# Status:   docker compose ps        (ambos devem ficar "healthy")
# Derrubar: docker compose down      (mantém os dados do Postgres)
#           docker compose down -v   (APAGA os volumes)

services:

  # Fonte da verdade: estado transacional (contas, ledger, idempotência, outbox).
  postgres:
    image: postgres:16.15
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking          # credencial só de dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # volume nomeado: sobrevive ao "down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Log de eventos: um único nó em KRaft fazendo papel de broker E controller.
  kafka:
    image: apache/kafka:4.3.2
    container_name: banking-kafka
    ports:
      - "9092:9092"                       # só o listener EXTERNAL é exposto ao host
    environment:
      # --- Identidade e papéis (KRaft) ---
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # id fixo do cluster (base64 de 16 bytes)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093   # quórum Raft de 1 voto (ok só em dev)

      # --- Listeners ---
      # listeners: onde o processo ESCUTA (dentro do container)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # advertised: o endereço que o broker DEVOLVE aos clientes para as conexões seguintes
      #   INTERNAL -> para outros containers na rede do compose
      #   EXTERNAL -> para a aplicação rodando no seu host (./mvnw spring-boot:run)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Tópicos internos com 1 réplica (só existe 1 broker) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Tópicos de negócio ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # tópicos serão criados explicitamente
      KAFKA_NUM_PARTITIONS: 3
    # Sem volume de propósito: em dev, os tópicos somem no "down".
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
